<div class="flex flex-col items-center h-screen bg-gray-100 dark:bg-neutral-900 transition-colors duration-200">
  <!-- Header removed as requested -->

  <!-- Tab Navigation -->
  <app-tab-navigation (tabChange)="onTabChange($event)" />

  <!-- Search Bar -->
  <app-search-bar (searchChange)="onSearchChange($event)" />

  <!-- Clipboard History -->
  <app-clipboard-history 
    [items]="clipboardService.filteredItems()"
    [loading]="clipboardService.loading()"
  />

  <router-outlet />
</div>
