<div class="px-3 py-2">
  <div class="relative max-w-sm mx-auto">
    <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
      <span class="material-symbols-outlined text-neutral-500 dark:text-neutral-400 text-[18px]">search</span>
    </div>
    <input
      type="text"
      pInputText
      [(ngModel)]="searchQuery"
      (input)="onSearchChange()"
      placeholder="Search clipboard history..."
      class="w-full pl-9 pr-9 py-2 bg-white dark:bg-neutral-800 text-neutral-900 dark:text-neutral-100 placeholder:text-neutral-500 dark:placeholder:text-neutral-400 border border-gray-200 dark:border-neutral-700 rounded-md focus:outline-none focus:ring-1 focus:ring-blue-600 focus:border-transparent transition-all"
    />
    @if (searchQuery) {
      <button
        (click)="clearSearch()"
        class="absolute inset-y-0 right-0 flex items-center pr-3 text-neutral-500 dark:text-neutral-400 hover:text-neutral-700 dark:hover:text-neutral-200 transition-colors"
      >
        <span class="material-symbols-outlined text-[18px]">close</span>
      </button>
    }
  </div>
</div>
